# Render Blueprint - Deciphex Content Studio
# See https://render.com/docs/blueprint-spec
services:
  - type: web
    name: content-studio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
